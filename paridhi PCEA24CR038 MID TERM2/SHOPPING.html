<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 30px;
        }

        .container {
            width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        button {
            padding: 6px 12px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            background: #2878c8;
            color: white;
        }

        .remove {
            background: #e53935;
        }

        .summary {
            margin-top: 20px;
            text-align: right;
            line-height: 2;
        }

        .final {
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Shopping Cart</h2>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="cartItems"></tbody>
    </table>

    <div class="summary" id="summary"></div>

</div>

<script>

    // Array of Objects
    let cart = [
        { name: "Notebook", price: 120, qty: 1 },
        { name: "Pen Pack", price: 60, qty: 1 },
        { name: "Water Bottle", price: 350, qty: 1 }
    ];

    // Display cart items
    function displayCart() {

        let output = "";

        cart.forEach((item, index) => {

            output += `
                <tr>
                    <td>${item.name}</td>
                    <td>Rs. ${item.price}</td>

                    <td>
                        <button onclick="changeQty(${index}, -1)">-</button>
                        ${item.qty}
                        <button onclick="changeQty(${index}, 1)">+</button>
                    </td>

                    <td>Rs. ${item.price * item.qty}</td>

                    <td>
                        <button class="remove"
                        onclick="removeItem(${index})">
                        Remove</button>
                    </td>
                </tr>
            `;
        });

        document.getElementById("cartItems").innerHTML = output;

        calculateTotal();
    }

    // Increase or decrease quantity
    function changeQty(index, change) {

        let newQty = cart[index].qty + change;

        if (newQty >= 1) {
            cart[index].qty = newQty;
        }

        displayCart();
    }

    // Remove item
    function removeItem(index) {

        cart.splice(index, 1);

        displayCart();
    }

    // Calculate subtotal and discount
    function calculateTotal() {

        if (cart.length === 0) {

            document.getElementById("cartItems").innerHTML = "";

            document.getElementById("summary").innerHTML =
                "<h3>Your cart is empty.</h3>";

            return;
        }

        let subtotal = 0;

        cart.forEach(item => {
            subtotal += item.price * item.qty;
        });

        let discount = 0;

        if (subtotal >= 1000) {
            discount = subtotal * 0.10;
        }

        let payable = subtotal - discount;

        document.getElementById("summary").innerHTML = `
            Subtotal: Rs. ${subtotal.toFixed(2)} <br>
            Discount (10%): Rs. ${discount.toFixed(2)} <br>
            <div class="final">
                Amount Payable: Rs. ${payable.toFixed(2)}
            </div>
        `;
    }

    // Initial display
    displayCart();

</script>

</body>
</html>
