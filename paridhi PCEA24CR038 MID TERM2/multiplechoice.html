
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        h2 {
            color: #222;
        }

        .option {
            display: block;
            text-align: left;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
        }

        .option:hover {
            background-color: #eee;
        }

        button {
            background-color: #222;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:disabled {
            background-color: gray;
            cursor: not-allowed;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            margin: 20px;
        }

        #message {
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <h2>JavaScript Quiz</h2>

    <div id="quiz">
        <h3 id="question"></h3>

        <div id="options"></div>

        <button id="nextBtn" disabled onclick="nextQuestion()">
            Next
        </button>
    </div>

    <div id="resultScreen" style="display:none;">
        <h2>JavaScript Quiz</h2>

        <div id="result"></div>

        <p id="message"></p>

        <button onclick="restartQuiz()">Restart Quiz</button>
    </div>

</div>

<script>

    const questions = [
        {
            question: "Which keyword declares a constant variable?",
            options: ["var", "let", "const", "static"],
            answer: 2
        },
        {
            question: "Which language is used for web development?",
            options: ["JavaScript", "Python", "C", "All of these"],
            answer: 0
        },
        {
            question: "Which method prints output in console?",
            options: ["print()", "console.log()", "display()", "write()"],
            answer: 1
        },
        {
            question: "Which symbol is used for comments in JavaScript?",
            options: ["#", "//", "<!-- -->", "**"],
            answer: 1
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selected = false;

    function loadQuestion() {

        selected = false;

        let q = questions[currentQuestion];

        document.getElementById("question").innerText =
            q.question;

        let optionsDiv = document.getElementById("options");

        optionsDiv.innerHTML = "";

        q.options.forEach((option, index) => {

            let label = document.createElement("label");

            label.className = "option";

            label.innerHTML = `
                <input type="radio" name="answer"
                value="${index}" onchange="selectAnswer(${index})">
                ${option}
            `;

            optionsDiv.appendChild(label);

        });

        let nextBtn = document.getElementById("nextBtn");

        nextBtn.disabled = true;

        if (currentQuestion === questions.length - 1) {
            nextBtn.innerText = "Finish";
        } else {
            nextBtn.innerText = "Next";
        }
    }

    function selectAnswer(index) {

        if (selected) return;

        selected = true;

        if (index === questions[currentQuestion].answer) {
            score++;
        }

        document.getElementById("nextBtn").disabled = false;
    }

    function nextQuestion() {

        if (!selected) return;

        currentQuestion++;

        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {

        document.getElementById("quiz").style.display = "none";

        document.getElementById("resultScreen").style.display = "block";

        let percentage = (score / questions.length) * 100;

        document.getElementById("result").innerText =
            score + "/" + questions.length;

        let message = "";

        if (percentage === 100) {
            message = "Excellent work!";
        }
        else if (percentage >= 50) {
            message = "Good job!";
        }
        else {
            message = "Keep practicing!";
        }

        document.getElementById("message").innerText =
            "You scored " + percentage + "%. " + message;
    }

    function restartQuiz() {

        currentQuestion = 0;
        score = 0;
        selected = false;

        document.getElementById("quiz").style.display = "block";

        document.getElementById("resultScreen").style.display = "none";

        loadQuestion();
    }

    loadQuestion();

</script>

</body>
</html>
